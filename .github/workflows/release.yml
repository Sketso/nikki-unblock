name: build & release

# Builds the architecture-independent package with the OpenWrt SDK and publishes it to the
# "latest" release under stable asset names (luci-app-nikki-unblock.apk / .ipk) that feed.sh pulls.
#
# Channels come from the tag: v2.43.0-beta.1 and v2.43.0-rc.1 are published as GitHub PRERELEASES,
# v2.43.0 as a normal release. GitHub's /releases/latest skips prereleases by definition, so the
# stable apk repo, feed.sh and the panel's "update" all stay on stable without a single extra check.
# The package version is stamped FROM the tag, so the Makefile can't drift from what gets released.
#
# NOTE: OpenWrt package builds can't be validated locally — the first run may need a small tweak
# (SDK ARCH tag / output path). Trigger via a tag push (git tag v1.0.0 && git push --tags) or the
# "Run workflow" button.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    # A tag with broken syntax must not turn into a release — same gate as check.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install busybox (router shell dialect)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox
      - name: Run checks
        run: sh tools/check.sh

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "24.10.0"   # opkg -> .ipk
            ext: ipk
          - release: "SNAPSHOT"  # apk  -> .apk
            ext: apk
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the package version from the tag
        if: github.ref_type == 'tag'
        run: |
          set -e
          printf '%s' "$GITHUB_REF_NAME" | grep -qxE 'v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?' \
            || { echo "tag '$GITHUB_REF_NAME' is not vX.Y.Z, vX.Y.Z-beta.N or vX.Y.Z-rc.N"; exit 1; }
          ver="${GITHUB_REF_NAME#v}"
          # A prerelease must sort BELOW its release, and the two package managers spell that differently:
          # apk ranks 2.43.0_rc1 < 2.43.0, while opkg follows Debian rules, where the same string would sort
          # ABOVE the release — it needs 2.43.0~rc1 instead.
          case "$ver" in *-beta.*|*-rc.*)
            if [ "${{ matrix.ext }}" = ipk ]; then sep='~'; else sep='_'; fi
            ver=$(printf '%s' "$ver" | sed -E "s/-(beta|rc)\.([0-9]+)\$/${sep}\1\2/") ;;
          esac
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$ver/" luci-app-nikki-unblock/Makefile
          # the post-install script reads this: apk's database still shows the OLD package while it runs
          printf '%s\n' "$ver" > luci-app-nikki-unblock/root/usr/share/nikki-unblock/version
          grep '^PKG_VERSION' luci-app-nikki-unblock/Makefile

      - name: Build package (OpenWrt SDK)
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64-${{ matrix.release }}
          FEEDNAME: nikki_unblock
          PACKAGES: luci-app-nikki-unblock
          NO_REFRESH_CHECK: "1"

      - name: Collect artifact under a stable name
        run: |
          set -e
          mkdir -p out
          f=$(find bin -name "luci-app-nikki-unblock*.${{ matrix.ext }}" | head -1)
          echo "built: $f"
          cp "$f" "out/luci-app-nikki-unblock.${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.ext }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten
        run: |
          mkdir -p out
          find dist -type f -exec cp {} out/ \;
          ls -l out
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          prerelease: ${{ github.ref_type == 'tag' && contains(github.ref_name, '-') }}
          files: out/*
